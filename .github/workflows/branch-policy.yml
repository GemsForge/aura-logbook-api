name: Branch workflow policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Require reviewed integration path
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$BASE" = "master" ] && [ "$HEAD" != "dev" ]; then
            echo "Pull requests into master must come from dev."
            exit 1
          fi
          if [ "$BASE" != "dev" ] && [ "$BASE" != "master" ]; then
            echo "Pull requests must target dev or master."
            exit 1
          fi
          echo "Branch workflow policy passed: $HEAD -> $BASE"
