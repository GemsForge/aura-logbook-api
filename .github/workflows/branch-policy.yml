name: Branch workflow policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Require issue branch and PR reference reviewed into master
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$BASE" != "master" ]; then
            echo "Pull requests must target master."
            exit 1
          fi
          if ! printf '%s\n' "$HEAD" | grep -Eq '^(feat|fix|docs|refactor|test|chore|ci|build|perf|style)/[1-9][0-9]*-[a-z0-9][a-z0-9-]*$'; then
            echo "Pull requests into master must come from a <type>/<issue>-<description> branch."
            exit 1
          fi
          BODY='${{ github.event.pull_request.body }}'
          ISSUE=$(printf '%s\n' "$HEAD" | sed -E 's#^[^/]+/([0-9]+)-.*#\1#')
          if ! printf '%s\n' "$BODY" | grep -Eq "#$ISSUE([[:space:][:punct:]]|$)"; then
            echo "PR body must reference #$ISSUE; merging does not close the story."
            exit 1
          fi
          echo "Branch workflow policy passed: $HEAD -> $BASE"
