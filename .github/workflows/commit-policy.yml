name: Commit policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  commit-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from "node:child_process";
          import { validateCommits } from "./Scripts/commit-policy.mjs";
          const base = process.env.BASE_SHA;
          const head = process.env.HEAD_SHA;
          const commits = execFileSync("git", ["rev-list", head, `^${base}`], { encoding: "utf8" }).trim();
          if (commits && !validateCommits(commits.split("\n"))) process.exit(1);
          console.log("Commit policy passed.");
          EOF
