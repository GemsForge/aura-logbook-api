name: Deploy Aura Logbook to Azure

on:
  pull_request:
    paths:
      - 'AuraLogbook.Api/**'
      - 'AuraLogbook.Api.Tests/**'
      - 'AuraLogbook.sln'
      - 'aura-ui/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deployment-smoke.yml'
  push:
    branches: [master]
  workflow_dispatch:

# Serialize release runs so an older deploy cannot overtake a newer one.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Test and package API and UI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          # Keep both runtimes available while #461 moves the deployed projects to .NET 10.
          dotnet-version: |
            9.0.x
            10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aura-ui/package-lock.json

      - name: Run API and migration tests
        run: dotnet test AuraLogbook.sln --configuration Release

      - name: Require the Azure-supported .NET target before release
        if: github.event_name != 'pull_request'
        run: |
          # GitHub's Ubuntu runner includes grep; ripgrep is not installed by default.
          if grep -R -n -E --include='*.csproj' '<TargetFramework>net9\\.0</TargetFramework>' .; then
            echo "::error::Merge #461 before deploying; the Azure App Service target is .NET 10."
            exit 1
          fi
          grep -q -E '<TargetFramework>net10\\.0</TargetFramework>' AuraLogbook.Api/AuraLogbook.Api.csproj || {
            echo "::error::The API must target .NET 10 before deployment."
            exit 1
          }

      - name: Install UI dependencies
        run: npm ci --prefix aura-ui

      - name: Configure a placeholder API URL for UI tests
        run: echo 'VITE_API_BASE_URL=https://api.example.com/api' >> aura-ui/.env

      - name: Lint UI
        run: npm run lint --prefix aura-ui

      - name: Test UI
        run: npm run test:run --prefix aura-ui

      - name: Verify UI startup script
        run: npm run test:startup --prefix aura-ui

      - name: Validate release URL configuration
        if: github.event_name != 'pull_request'
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          AZURE_API_URL: ${{ vars.AZURE_API_URL }}
          AZURE_UI_URL: ${{ vars.AZURE_UI_URL }}
        run: |
          node --input-type=module <<'NODE'
          const required = ["VITE_API_BASE_URL", "AZURE_API_URL", "AZURE_UI_URL"];
          for (const name of required) {
            if (!process.env[name]?.trim()) throw new Error(`Configure repository variable ${name} before deployment.`);
          }

          const apiBase = new URL(process.env.VITE_API_BASE_URL);
          const apiOrigin = new URL(process.env.AZURE_API_URL);
          const uiOrigin = new URL(process.env.AZURE_UI_URL);
          const isHttpsOrigin = (url) => url.protocol === "https:" && url.username === "" && url.password === "" && url.pathname === "/" && url.search === "" && url.hash === "";
          if (!isHttpsOrigin(apiOrigin) || !isHttpsOrigin(uiOrigin)) throw new Error("AZURE_API_URL and AZURE_UI_URL must be HTTPS origins without paths.");
          if (apiBase.protocol !== "https:" || apiBase.origin !== apiOrigin.origin || apiBase.pathname.replace(/\/$/, "") !== "/api" || apiBase.search || apiBase.hash) {
            throw new Error("VITE_API_BASE_URL must use AZURE_API_URL and end in /api.");
          }
          NODE

      - name: Build production UI
        run: npm run build --prefix aura-ui
        env:
          # Pull requests use a non-secret placeholder; release builds use the configured public API URL.
          VITE_API_BASE_URL: ${{ github.event_name == 'pull_request' && 'https://api.example.com/api' || vars.VITE_API_BASE_URL }}

      - name: Publish API for Linux App Service
        run: dotnet publish AuraLogbook.Api/AuraLogbook.Api.csproj --configuration Release --output "$RUNNER_TEMP/api-publish"

      - name: Package API publish output
        run: |
          cd "$RUNNER_TEMP/api-publish"
          zip -qr "$RUNNER_TEMP/api-publish.zip" .

      - name: Upload API package
        uses: actions/upload-artifact@v4
        with:
          name: aura-api
          path: ${{ runner.temp }}/api-publish.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload UI package
        uses: actions/upload-artifact@v4
        with:
          name: aura-ui
          path: aura-ui/dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy API then UI
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download API package
        uses: actions/download-artifact@v4
        with:
          name: aura-api
          path: api-package

      - name: Download UI package
        uses: actions/download-artifact@v4
        with:
          name: aura-ui
          path: aura-ui/dist

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: auralogbook-api
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: api-package/api-publish.zip

      - name: Deploy UI to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          action: upload
          app_location: aura-ui/dist
          output_location: ''
          skip_app_build: true

  smoke:
    name: Verify deployed API and UI
    if: github.event_name != 'pull_request'
    needs: deploy
    uses: ./.github/workflows/deployment-smoke.yml
    with:
      api_url: ${{ vars.AZURE_API_URL }}
      ui_url: ${{ vars.AZURE_UI_URL }}
