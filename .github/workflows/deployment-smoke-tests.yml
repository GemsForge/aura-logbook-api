name: Deployment smoke script tests

on:
  pull_request:
    paths:
      - 'Scripts/deployment-smoke-test.mjs'
      - 'Scripts/deployment-smoke-test.test.mjs'
      - '.github/workflows/deployment-smoke.yml'
      - '.github/workflows/deployment-smoke-tests.yml'
  push:
    branches: [master]
    paths:
      - 'Scripts/deployment-smoke-test.mjs'
      - 'Scripts/deployment-smoke-test.test.mjs'
      - '.github/workflows/deployment-smoke.yml'
      - '.github/workflows/deployment-smoke-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    name: Test deployment smoke probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check smoke probe syntax
        run: node --check Scripts/deployment-smoke-test.mjs
      - name: Test smoke probe retries and failures
        run: node --test Scripts/deployment-smoke-test.test.mjs
