name: Aura UI checks

on:
  pull_request:
    paths:
      - "aura-ui/**"
      - ".github/workflows/ui-checks.yml"
  push:
    branches: [dev, master]
    paths:
      - "aura-ui/**"
      - ".github/workflows/ui-checks.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: aura-ui

jobs:
  ui:
    name: Lint, test, and build UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aura-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure test API base URL
        run: echo "VITE_API_BASE_URL=http://localhost:5000/api" >> .env

      - name: Lint changed UI files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'aura-ui/src/**/*.ts' 'aura-ui/src/**/*.tsx')
          if [ -n "$files" ]; then
            npx eslint $files
          else
            echo "No TypeScript UI files changed."
          fi

      - name: Lint full UI
        if: github.event_name != 'pull_request'
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Verify the UI startup script
        run: npm run test:startup

      - name: Build
        run: npm run build
