name: Aura UI checks

on:
  pull_request:
    paths:
      - "aura-ui/**"
      - ".github/workflows/ui-checks.yml"
  push:
    branches: [dev, master]
    paths:
      - "aura-ui/**"
      - ".github/workflows/ui-checks.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: aura-ui

jobs:
  ui:
    name: Lint, test, and build UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aura-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
