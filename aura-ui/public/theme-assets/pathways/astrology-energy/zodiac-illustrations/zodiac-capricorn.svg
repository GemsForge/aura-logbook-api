<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="zo-capricorn-t zo-capricorn-d"><title id="zo-capricorn-t">Capricorn, Earth sign, Dec 22 – Jan 19</title><desc id="zo-capricorn-d">Two-ink print of the Capricorn glyph on an earth-coloured sun over its constellation, with the name written in italics and the Earth element triangle. Earth signs use the square tile.</desc><defs><clipPath id="zo-capricorn-clip"><rect x="10" y="10" width="300" height="300" rx="10"/></clipPath>
