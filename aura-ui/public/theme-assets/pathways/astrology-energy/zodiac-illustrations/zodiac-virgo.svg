<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="zo-virgo-t zo-virgo-d"><title id="zo-virgo-t">Virgo, Earth sign, Aug 23 – Sep 22</title><desc id="zo-virgo-d">Two-ink print of the Virgo glyph on an earth-coloured sun over its constellation, with the name written in italics and the Earth element triangle. Earth signs use the square tile.</desc><defs><clipPath id="zo-virgo-clip"><rect x="10" y="10" width="300" height="300" rx="10"/></clipPath>
